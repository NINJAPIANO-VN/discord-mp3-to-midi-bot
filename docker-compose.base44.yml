services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile.base44
    ports:
      - "3000:3000"
    volumes:
      - .:/app
    env_file:
      - ./.env.base44-defaults
      - /run/base44/app.env
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:3000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 120s
