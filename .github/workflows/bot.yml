name: Discord MP3-to-MIDI Bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: discord-mp3-midi-bot-v2
  cancel-in-progress: false

jobs:
  run-bot-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: ""

      - name: Cài ffmpeg và thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Cài đặt PyTorch chuẩn
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir torch torchaudio
          pip install --no-cache-dir -r requirements.txt

      - name: Tạo file Patch cho Torchaudio
        run: |
          cat << 'EOF' > /tmp/patch_torchaudio.py
          import os
          os.environ["TORCHAUDIO_USE_BACKEND_DISPATCHER"] = "0"
          try:
              import torch
              torch.ops.load_library = lambda x: None
          except Exception:
              pass
          EOF

      - name: Chạy bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          PYTHONSTARTUP: /tmp/patch_torchaudio.py
          TORCHAUDIO_USE_BACKEND_DISPATCHER: "0"
        run: python bot.py
