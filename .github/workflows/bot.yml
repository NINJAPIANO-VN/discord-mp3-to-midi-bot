name: Discord MP3-to-MIDI Bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: discord-mp3-midi-bot-v8
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài ffmpeg và thư viện hệ thống
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Cài đặt PyTorch & Torchaudio chuẩn CPU
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install torch==2.1.2 torchaudio==2.1.2 --index-url https://download.pytorch.org/whl/cpu --force-reinstall --no-deps

      - name: Chạy bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
          YT_COOKIES: ${{ secrets.YT_COOKIES }}
          TIKHUB_API_TOKEN: ${{ secrets.TIKHUB_API_TOKEN }}
        run: |
          if [ -n "$YT_COOKIES" ]; then
            echo "$YT_COOKIES" > cookies.txt
          fi
          python bot.py
