name: Discord MP3-to-MIDI Bot

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 */6 * * *"

concurrency:
  group: discord-mp3-midi-bot
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài ffmpeg (Transkun cần để đọc mp3)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libsndfile1

      - name: Cài PyTorch & TorchAudio CPU qua Wheel trực tiếp
        run: |
          python -m pip install --upgrade pip
          pip install https://download.pytorch.org/whl/cpu/torch-2.2.2%2Bcpu-cp311-cp311-linux_x86_64.whl
          pip install https://download.pytorch.org/whl/cpu/torchaudio-2.2.2%2Bcpu-cp311-cp311-linux_x86_64.whl

      - name: Cài các thư viện còn lại
        run: |
          pip install --no-deps -r requirements.txt
          pip install pretty_midi soundfile numpy python-dotenv discord.py

      - name: Chạy bot
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_GUILD_ID: ${{ secrets.DISCORD_GUILD_ID }}
        run: python bot.py
